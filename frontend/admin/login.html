<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — Awaaz</title>
  <link rel="stylesheet" href="/static/style.css"/>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .login-card { width:100%; max-width:420px; padding:2.5rem; }
    .login-logo { text-align:center; margin-bottom:2rem; }
    .login-logo .logo-icon { width:56px; height:56px; border-radius:16px; background:var(--accent-grad); font-size:1.8rem; display:flex; align-items:center; justify-content:center; margin:0 auto .75rem; }
    .login-logo h1 { font-size:1.4rem; font-weight:800; }
    .login-logo p  { font-size:.85rem; color:var(--text-secondary); margin-top:.25rem; }
    .pw-wrap { position:relative; }
    .pw-wrap input { padding-right:3rem; }
    .pw-toggle { position:absolute; right:.75rem; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:1rem; }
  </style>
</head>
<body>
<div class="bg-mesh"></div>
<div class="card login-card">
  <div class="login-logo">
    <div class="logo-icon">🛡️</div>
    <h1>Admin Portal</h1>
    <p>Awaaz Grievance Redressal System</p>
  </div>
  <form id="login-form" novalidate>
    <div class="form-group">
      <label class="form-label" for="admin-pw">Admin Password</label>
      <div class="pw-wrap">
        <input type="password" id="admin-pw" class="form-control" placeholder="Enter password" autofocus required/>
        <button type="button" class="pw-toggle" onclick="togglePw()">👁️</button>
      </div>
    </div>
    <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn">🔓 Login</button>
  </form>
  <p style="text-align:center; margin-top:1.5rem; font-size:.82rem; color:var(--text-muted);">
    <a href="/" style="color:var(--accent);">← Back to public site</a>
  </p>
</div>

<script src="/static/app.js"></script>
<script>
  function togglePw() {
    const inp = document.getElementById('admin-pw');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }
  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    btn.disabled = true; btn.textContent = '⏳ Logging in…';
    try {
      await apiPost('/api/admin/login', { password: document.getElementById('admin-pw').value });
      location.href = '/admin/dashboard';
    } catch(err) {
      showToast('Invalid password. Try again.', 'error');
      btn.disabled = false; btn.textContent = '🔓 Login';
    }
  });
</script>
</body>
</html>
